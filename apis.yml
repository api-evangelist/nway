name: nWay
description: 'nWay is a San Francisco-based multiplayer game developer and publisher
  founded in 2011, known for real-time synchronous PvP titles including Power Rangers:
  Legacy Wars (70M+ downloads), Power Rangers: Battle for the Grid, and the Web3 mech-combat
  game Wreck League. Its proprietary nWayPlay engine powers fast-paced cross-platform
  multiplayer across mobile, PC, and console. nWay was surfaced as a portfolio lead
  of cowboy-ventures. As a consumer gaming studio it publishes no public developer
  API, developer portal, or documented API surface; enrichment probes of its website,
  /.well-known/security.txt, and /llms.txt returned no API artifacts.'
